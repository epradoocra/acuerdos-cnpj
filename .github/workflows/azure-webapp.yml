# Publica el sistema en Azure App Service (Linux, Python 3.12) cada vez que se sube código a la rama main.
#
# Configuración previa en GitHub (Settings > Secrets and variables > Actions):
#   - Variable  AZURE_WEBAPP_NAME             nombre de la Web App (p. ej. acuerdos-cnpj)
#   - Secreto   AZURE_WEBAPP_PUBLISH_PROFILE  contenido del "perfil de publicación" descargado del portal de Azure
name: Publicar en Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Revisar configuración, migraciones y plantillas
        env:
          DJANGO_SECRET_KEY: ci-solo-pruebas
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput -v 0
          python manage.py collectstatic --noinput -v 0
      - name: Empaquetar
        run: zip -r ../app.zip . -x ".git/*" ".github/*" "venv/*" "staticfiles/*" "db.sqlite3" "migracion/*" "media/*"
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: ../app.zip

  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
      - name: Publicar en Azure
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip
